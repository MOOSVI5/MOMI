name: Deploy Momi Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GitHub Pages Eligibility
        shell: bash
        run: |
          echo "Repository private=${{ github.event.repository.private }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::This repository is PRIVATE. GitHub Free accounts cannot host GitHub Pages from a private repo. Make MOOSVI5/MOMI Public in Settings -> General -> Danger Zone, OR open Settings -> Pages -> Source: GitHub Actions (GitHub Pro)."
            exit 1
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web App Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Web App Link Summary
        shell: bash
        run: |
          {
            echo "### Momi Web App Live URL"
            echo "Open on desktop or mobile: ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "If Google Sign-In asks for domain authorization, add \`${{ github.repository_owner }}.github.io\` in Firebase Console -> Authentication -> Settings -> Authorized domains."
          } >> "$GITHUB_STEP_SUMMARY"

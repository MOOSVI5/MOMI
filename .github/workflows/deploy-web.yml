name: Deploy Momi Web App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Repository Visibility
        shell: bash
        run: |
          echo "Repository=${{ github.repository }} private=${{ github.event.repository.private }}"
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "::error::Repository is PRIVATE. GitHub Free does not support GitHub Pages on private repositories. Make MOOSVI5/MOMI Public in Settings -> General -> Danger Zone."
            exit 1
          fi

      - name: Publish ./web to gh-pages Branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_NAME="${VERSION_NAME:-2.3}"
          VERSION_CODE="$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/.*=\s*([0-9]+).*/\1/')"
          VERSION_CODE="${VERSION_CODE:-14}"
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          BUILD_NUM="${{ github.run_number }}"
          BUILT_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          TMP_DIR="$(mktemp -d)"
          cp -R web/. "$TMP_DIR/"
          touch "$TMP_DIR/.nojekyll"
          cat > "$TMP_DIR/version.json" <<EOF
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "buildNumber": $BUILD_NUM,
            "commitSha": "$SHORT_SHA",
            "releasedAt": "$BUILT_AT",
            "releaseTitle": "Momi v$VERSION_NAME",
            "releaseNotes": "Latest pushed build #$BUILD_NUM ($SHORT_SHA) is live.",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/Momi-latest.apk",
            "releasesUrl": "https://github.com/${{ github.repository }}/releases/latest",
            "webUrl": "https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/"
          }
          EOF
          if [ -f "$TMP_DIR/sw.js" ]; then
            sed -i -E "s|const CACHE_NAME = '[^']+';|const CACHE_NAME = 'momi-web-v${VERSION_NAME}-${BUILD_NUM}-${SHORT_SHA}';|" "$TMP_DIR/sw.js"
          fi
          cd "$TMP_DIR"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Momi Web App (${{ github.sha }})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Enable & Configure GitHub Pages Site
        id: pages_api
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PAYLOAD='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api "/repos/${REPO}/pages" >/dev/null 2>&1; then
            echo "$PAYLOAD" | gh api -X PUT "/repos/${REPO}/pages" --input - || true
          else
            echo "$PAYLOAD" | gh api -X POST "/repos/${REPO}/pages" --input - || true
          fi
          gh api -X POST "/repos/${REPO}/pages/builds" >/dev/null 2>&1 || true
          SITE_URL="$(gh api "/repos/${REPO}/pages" --jq '.html_url' 2>/dev/null || echo "")"
          if [ -z "$SITE_URL" ]; then
            REPO_NAME="${REPO#*/}"
            SITE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/"
          fi
          echo "url=$SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Publish Web App Link Summary
        if: always()
        shell: bash
        run: |
          SITE_URL="${{ steps.pages_api.outputs.url }}"
          {
            echo "### Momi Web App Live URL"
            echo "$SITE_URL"
            echo ""
            echo "Ensure \`$SITE_URL\` is listed under Supabase Dashboard -> Authentication -> URL Configuration -> Redirect URLs."
          } >> "$GITHUB_STEP_SUMMARY"

name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Assemble Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and Accept Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | sort -r | head -n 1 || true)"
          if [ -n "$CMDLINE_BIN" ]; then
            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
            export PATH="$CMDLINE_BIN:$PATH"
          fi
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            sdkmanager --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || true
          else
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "used_secret=true" >> "$GITHUB_OUTPUT"
          else
            TEMP_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$TEMP_PASS"
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=Momi, OU=App, O=Momi, L=City, ST=State, C=US"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "used_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print Release Signing Certificate Fingerprints
        shell: bash
        run: |
          FINGERPRINTS="$(keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep -E 'SHA1:|SHA256:' || true)"
          echo "$FINGERPRINTS"
          {
            echo "### Release APK Signing Fingerprints"
            echo "Add these to Firebase Console -> Project \`gen-lang-client-0132255277\` -> Android app \`com.aistudio.luma.xkpqrm\` so Google Sign-In works in release builds:"
            echo '```'
            echo "$FINGERPRINTS"
            echo '```'
            if [ "${{ steps.keystore.outputs.used_secret }}" != "true" ]; then
              echo ""
              echo "> **Note:** Built with a one-time runner keystore because \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` secrets were not set. For permanent store updates with the same key, save your keystore in GitHub Settings -> Secrets and variables -> Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::error::Missing app/google-services.json in repository and GOOGLE_SERVICES_JSON secret is not set. Add app/google-services.json or set the GOOGLE_SERVICES_JSON repository secret."
              exit 1
            fi
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: momi-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Assemble Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK and Accept Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(find "$SDK_DIR/cmdline-tools" -maxdepth 2 -name bin -type d 2>/dev/null | sort -r | head -n 1 || true)"
          if [ -n "$CMDLINE_BIN" ]; then
            echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
            export PATH="$CMDLINE_BIN:$PATH"
          fi
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            sdkmanager --sdk_root="$SDK_DIR" "platforms;android-36.1" "build-tools;36.0.0" || true
          else
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "used_secret=true" >> "$GITHUB_OUTPUT"
          else
            TEMP_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$TEMP_PASS"
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=Momi, OU=App, O=Momi, L=City, ST=State, C=US"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "used_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print Release Signing Certificate Fingerprints
        shell: bash
        run: |
          FINGERPRINTS="$(keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$STORE_PASSWORD" | grep -E 'SHA1:|SHA256:' || true)"
          echo "$FINGERPRINTS"
          {
            echo "### Release APK Signing Fingerprints"
            echo "Add these SHA-1 / SHA-256 fingerprints to your Google Cloud Android OAuth Client (\`com.aistudio.luma.xkpqrm\`) if needed for Google Sign-In in release builds:"
            echo '```'
            echo "$FINGERPRINTS"
            echo '```'
            if [ "${{ steps.keystore.outputs.used_secret }}" != "true" ]; then
              echo ""
              echo "> **Note:** Built with a one-time runner keystore because \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` secrets were not set. For permanent store updates with the same key, save your keystore in GitHub Settings -> Secrets and variables -> Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare Versioned APK for GitHub Release
        id: release_meta
        shell: bash
        run: |
          VERSION_NAME="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_NAME="${VERSION_NAME:-2.3}"
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found."
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/Momi-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "release-assets/Momi-latest.apk"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_file=Momi-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: momi-release-apk
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version_name }}
          name: Momi v${{ steps.release_meta.outputs.version_name }}
          make_latest: true
          files: release-assets/*.apk
          body: |
            Signed Android APK for **Momi v${{ steps.release_meta.outputs.version_name }}** (CI Build #${{ github.run_number }}).

            ### How to install on Android
            1. Tap **${{ steps.release_meta.outputs.apk_file }}** (or **Momi-latest.apk**) under Assets below to download directly (no GitHub login needed).
            2. Open the downloaded `.apk` file and tap **Install** (allow installation from your browser if prompted).

      - name: Print Direct APK Link
        shell: bash
        run: |
          {
            echo "### Direct Signed Release APK Link"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/Momi-latest.apk"
            echo ""
            echo "### Versioned APK Link"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/${{ steps.release_meta.outputs.apk_file }}"
            echo ""
            echo "### GitHub Releases Page"
            echo "https://github.com/${{ github.repository }}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
